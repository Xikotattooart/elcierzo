<!DOCTYPE html>
<html lang="es"><head><meta charset="utf-8">

<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600&family=Pacifico&family=Playfair+Display&family=UnifrakturCook:wght@700&family=Cinzel&family=Bebas+Neue&family=Permanent+Marker&family=Great+Vibes&display=swap" rel="stylesheet">

<style>
:root{--bg:#09090B;--gl:rgba(20,20,24,.62);--bd:rgba(255,255,255,.08);--tx:#F4F4F5;--mu:#A1A1AA;color-scheme:dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box}
html,body{height:100%;margin:0;background:var(--bg);color:var(--tx);font:13px/1.3 Outfit,system-ui,sans-serif;overflow:hidden;overscroll-behavior:none;-webkit-user-select:none;user-select:none}
body{position:relative}
.glass{background:var(--gl);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border:1px solid var(--bd);border-radius:16px}
button,select,input,textarea{font:inherit;color:var(--tx)}
button{background:rgba(255,255,255,.06);border:1px solid var(--bd);border-radius:9px;padding:6px 10px;cursor:pointer;white-space:nowrap}
button:hover{background:rgba(255,255,255,.12)}
button.on{background:#F4F4F5;color:#09090B}
select,textarea,input[type=number],input[type=text]{background:rgba(255,255,255,.06);border:1px solid var(--bd);border-radius:8px;padding:5px 7px;width:100%}
input[type=range]{accent-color:#d4d4d8;width:100%}
label{display:grid;grid-template-columns:92px 1fr;gap:6px;align-items:center;margin:5px 0;color:var(--mu)}
hr{border:0;border-top:1px solid var(--bd);margin:10px 0}
.wm b{font-weight:600;color:#F4F4F5}.wm i{font-style:normal;font-weight:500;color:#A1A1AA}
.tile{width:30px;height:30px;border-radius:9px;background:#F5F5F3;display:grid;place-items:center;flex:none}
#splash{position:fixed;inset:0;z-index:100;background:linear-gradient(#EDEDEA,#D9D9D5);display:grid;place-items:center;transition:opacity .9s ease;cursor:pointer}
#splash.out{opacity:0;pointer-events:none}
#splash .in{display:flex;flex-direction:column;align-items:center;gap:26px;font-size:clamp(34px,8vw,64px);animation:rise 1.2s ease both}#splash .wm b{color:#111111}#splash .wm i{color:#555555}#splash .wm{letter-spacing:-.02em}.bigtile{width:150px;height:150px;border-radius:34px;background:#F5F5F3;box-shadow:0 22px 50px rgba(0,0,0,.28),0 0 0 1px rgba(0,0,0,.07);display:grid;place-items:center}
@keyframes rise{from{opacity:0;transform:translateY(14px) scale(.97)}to{opacity:1;transform:none}}
#top{position:absolute;top:8px;left:8px;right:8px;height:46px;display:flex;align-items:center;gap:10px;padding:0 8px;z-index:20}
#top .wm{font-size:15px}
#mods{display:flex;gap:4px;margin:0 auto}
#tools{display:flex;gap:4px;overflow-x:auto;max-width:62%}
#tools button{padding:6px 8px}
#stage{position:absolute;inset:0;overflow:hidden;touch-action:none;background:radial-gradient(circle at 50% 40%,#18181b,#09090B)}
#doc{position:absolute;left:0;top:0;transform-origin:0 0;background:#fff;box-shadow:0 20px 60px rgba(0,0,0,.6);isolation:isolate}
#doc canvas{position:absolute;left:0;top:0;pointer-events:none}
#selbox{position:absolute;border:2px dashed #fff;mix-blend-mode:difference;pointer-events:none;display:none;z-index:999}
#ruler{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;z-index:5}
#side{position:absolute;right:8px;top:64px;bottom:8px;width:54px;display:flex;flex-direction:column;align-items:center;gap:8px;padding:10px 0;z-index:20;overflow-y:auto}
#side button{width:38px;height:38px;padding:0;font-size:16px}
.vs{writing-mode:vertical-lr;direction:rtl;height:110px;width:24px;flex:none}
.sl{font-size:10px;color:var(--mu)}
#pop{position:absolute;right:70px;top:64px;width:300px;max-height:calc(100% - 80px);overflow:auto;padding:12px;z-index:25}
.sw{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}.sw i{width:26px;height:26px;border-radius:50%;border:1px solid var(--bd);cursor:pointer}
.row{display:flex;gap:6px;margin:6px 0}
.li{display:flex;gap:4px;align-items:center;padding:4px;border-radius:8px;margin:3px 0}.li span{flex:1;cursor:pointer}.li.sel{background:rgba(255,255,255,.12)}.li button{padding:2px 7px}
.bi{display:flex;align-items:center;justify-content:space-between;gap:6px;padding:4px 6px;border-radius:8px;cursor:pointer}.bi:hover{background:rgba(255,255,255,.07)}.bi.sel{background:rgba(255,255,255,.15)}.bi canvas{flex:none}
details summary{cursor:pointer;padding:6px 0;font-weight:500}
.mod{position:absolute;left:8px;right:8px;top:62px;bottom:8px;z-index:15;background:rgba(12,12,15,.86);padding:14px;display:flex;flex-direction:column;gap:10px}
.mod[hidden],#pop[hidden],#side[hidden]{display:none}
.mw{flex:1;display:flex;gap:10px;min-height:0}
.cv{flex:1;display:grid;place-items:center;min-width:0;min-height:0;overflow:hidden;border:1px dashed var(--bd);border-radius:12px}
.cv canvas{max-width:100%;max-height:100%}
.paper{background:#fff}.chk{background:repeating-conic-gradient(#555 0 25%,#333 0 50%) 0 0/16px 16px}
.ctl{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:4px 16px;align-items:center}
.ctl label{grid-template-columns:90px 1fr}
.drop{flex:1;display:grid;place-items:center;border:2px dashed var(--bd);border-radius:14px;color:var(--mu);text-align:center;outline:0;min-height:0;overflow:hidden}
.drop img{max-width:90%;max-height:90%}.fb{display:block;margin:0;padding:6px 10px;border:1px solid var(--bd);border-radius:9px;background:rgba(255,255,255,.06);cursor:pointer;color:var(--tx);white-space:nowrap}.fb:hover{background:rgba(255,255,255,.12)}.ck{display:flex;gap:6px;margin:0;color:var(--tx)}#mpanel{position:absolute;left:8px;bottom:8px;width:236px;padding:12px;z-index:20;display:flex;flex-direction:column;gap:8px}#mpanel[hidden]{display:none}body.portrait .mw{flex-direction:column}@media(max-width:860px){#top .wm{display:none}}.dl{background:#F5F5F3;color:#09090B;font-weight:600;flex:none}.dl:hover{background:#fff}@media(max-width:1100px){.dl span{display:none}}
</style></head><body>
<svg width="0" height="0" style="position:absolute"><defs><radialGradient id="dg" cx=".38" cy=".62" r=".7"><stop offset="0" stop-color="#52525c"/><stop offset=".45" stop-color="#16161b"/><stop offset="1" stop-color="#000"/></radialGradient></defs>
<symbol id="drop" viewBox="0 0 100 130"><path d="M50 4C50 4 12 52 12 82c0 26 17 44 38 44s38-18 38-44C88 52 50 4 50 4z" fill="url(#dg)" stroke="rgba(255,255,255,.22)" stroke-width="1.5"/><path d="M28 86C25 66 36 48 47 32C42 54 41 76 44 98C36 100 29 96 28 86z" fill="rgba(255,255,255,.28)"/><ellipse cx="56" cy="106" rx="17" ry="6" fill="rgba(255,255,255,.1)"/><path d="M23 82C23 67 31 52 40 40" stroke="#fff" stroke-opacity=".9" stroke-width="2.6" fill="none" stroke-linecap="round"/><ellipse cx="30" cy="94" rx="3.2" ry="6" fill="#fff" fill-opacity=".85" transform="rotate(14 30 94)"/><path d="M73 102C67 113 57 119 46 119" stroke="rgba(255,255,255,.4)" stroke-width="2" fill="none" stroke-linecap="round"/></symbol></svg>

<div id="splash"><div class="in"><div class="bigtile"><svg width="62" height="80"><use href="#drop"/></svg></div><span class="wm"><b>TattooPro</b> <i>Sketch</i></span></div></div>

<header id="top" class="glass">
 <div class="tile"><svg width="15" height="20"><use href="#drop"/></svg></div><span class="wm"><b>TattooPro</b> <i>Sketch</i></span>
 <nav id="mods"><button data-m="ipad" class="on">iPad Art</button><button data-m="transfer">Transfer Tattoo</button><button data-m="quit">Quitafondos</button><button data-m="pint">Pinterest</button><button data-m="mandala">Mandalas</button></nav>

 <div id="tools">
  <button data-p="sheet" title="Hoja, DPI y exportar">⚙ Hoja</button>
  <button data-t="sel" title="Seleccionar">⬚</button><button id="bcut" title="Cortar">✂</button><button id="bcopy" title="Copiar">⧉</button><button id="bpaste" title="Pegar">⎘</button><button id="bcrop" title="Recortar lienzo">⌗</button>
  <button id="bundo" title="Deshacer">↶</button><button id="bredo" title="Rehacer">↷</button>
  <button id="bruler" title="Regla en cm/mm">📏</button><button id="brot" title="Girar lienzo 90°">⟳</button><button id="block" title="Bloquear orientación / giro">🔓</button><button id="bfit" title="Ajustar vista">⤢</button><button id="b11" title="Tamaño real aprox.">1:1</button><button id="bexp" title="Exportar PNG">⤓</button>
 </div>
</header>

<main id="stage"><div id="doc"><canvas id="tmp"></canvas><div id="selbox"></div></div><canvas id="ruler"></canvas></main>

<aside id="side" class="glass">
 <span class="sl">Tamaño</span><input id="vsz" class="vs" type="range" min="1" max="150" value="4">
 <span class="sl">Opac.</span><input id="vop" class="vs" type="range" min="5" max="100" value="100">
 <button data-p="brush" title="Pinceles">✒</button><button data-t="erase" title="Goma">⌫</button><button data-p="layers" title="Capas">☰</button><button data-p="text" title="Tipografía">T</button><button data-t="hand" title="Mover vista">✋</button><button data-p="color" id="bcol" title="Color" style="background:#000"></button>
</aside>
<div id="pop" class="glass" hidden></div>
<div id="mpanel" class="glass" hidden><b>Mandala · ejes</b><div class="row" id="mn" style="flex-wrap:wrap"></div><label class="ck"><input id="mmir" type="checkbox">Espejo (kaleidoscopio)</label><label class="ck"><input id="mgd" type="checkbox" checked>Guías polares</label><div class="row"><button data-t="ctr">Colocar centro</button><button id="mc0">Centrar</button></div></div>

<section class="mod glass" id="m-transfer" hidden>
 <div class="row"><b style="align-self:center">Transfer Tattoo</b><label class="fb">Subir foto<input type="file" id="tfile" accept="image/*" hidden></label><button id="tcan">Desde el lienzo</button><span style="color:var(--mu);align-self:center">Línea sólida = contornos y zonas oscuras · discontinua = sombras medias</span></div>
 <div class="mw"><div class="cv"><canvas id="tsrc"></canvas></div><div class="cv"><canvas id="tout" class="paper"></canvas></div></div>
 <div class="ctl"><label>Detalle de línea<input id="t1" type="range" min="1" max="100" value="50"></label><label>Sens. de sombra<input id="t2" type="range" min="0" max="100" value="50"></label><label>Grosor<input id="t3" type="range" min="0" max="3" value="1"></label>
 <div class="row"><label style="display:flex;gap:6px;margin:0"><input id="tmir" type="checkbox">Espejo</label><button id="tsend">Enviar al lienzo</button><button id="tdl">Descargar PNG</button></div></div>
</section>

<section class="mod glass" id="m-quit" hidden>
 <div class="row"><b style="align-self:center">Quitafondos</b><label class="fb">Subir imagen<input type="file" id="qfile" accept="image/*" hidden></label><button id="qauto">Autodetectar fondo</button><button id="qpick">Cuentagotas</button><span id="qinfo" style="color:var(--mu);align-self:center"></span></div>
 <div class="mw"><div class="cv chk"><canvas id="qsrc"></canvas></div></div>
 <div class="ctl"><label>Tolerancia<input id="q1" type="range" min="0" max="100" value="20"></label><label>Suavizado bordes<input id="q2" type="range" min="0" max="100" value="15"></label><div class="row"><button id="qdl">Descargar PNG transparente</button><button id="qins">Insertar como capa</button></div></div>
</section>

<section class="mod glass" id="m-pint" hidden>
 <div class="row"><input id="pq" type="text" placeholder="Buscar en Pinterest: tatuaje, lettering, flores…"><button id="pgo">Buscar en Pinterest</button></div>
 <div class="drop" id="pdrop" tabindex="0"><div id="ptxt">Pega aquí con Ctrl+V o arrastra una imagen de referencia.<br>Se abre Pinterest en otra pestaña, copia la imagen y vuelve.</div></div>
 <div class="row"><button id="p1">→ Lienzo</button><button id="p2">→ Transfer</button><button id="p3">→ Quitafondos</button></div>
</section>

<script>
const $=s=>document.querySelector(s),$$=s=>[...document.querySelectorAll(s)];
// favicon
const DP='M50 4C50 4 12 52 12 82c0 26 17 44 38 44s38-18 38-44C88 52 50 4 50 4z';
$('#fav').href='data:image/svg+xml,'+encodeURIComponent(`<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128"><rect width="128" height="128" rx="28" fill="#F5F5F3"/><path transform="translate(34 24) scale(.6)" d="${DP}" fill="#050505"/></svg>`);
setTimeout(()=>$('#splash').classList.add('out'),2000);$('#splash').onclick=()=>$('#splash').classList.add('out');

// ===== estado =====
let W=1240,H=1754,DPI=150,layers=[],act=0,v={x:0,y:0,s:.4,r:0},tool='draw',color='#000000',op=1,size=4,stab=.3,bi=0,mod='ipad',cur=0,rul=false,sel=null,clip=null,penSeen=0,space=0;
const doc=$('#doc'),stage=$('#stage'),tmp=$('#tmp'),tx=tmp.getContext('2d'),sbox=$('#selbox');
// ===== pinceles =====
const B=[];const F=['1 · Líneas (Liners)','2 · Sombreado (Shaders y Magnum)','3 · Efectos y multilínea'];
const add=(f,n,o)=>B.push(Object.assign({f,n,k:'round',s:4,mn:1,fl:1,sp:.12,pr:1,st:.25},o));
[['1RL',1.5],['3RL',2.5],['5RL',3.5],['7RL',4.5],['9RL',6],['14RL',8]].forEach(([n,s])=>add(0,'Aguja '+n,{s,mn:.65}));
[['Fino a grueso 1',6,.08],['Fino a grueso 2',9,.05],['Taper tinta',12,.04],['Pluma dip',10,.15],['Brush pen',16,.1],['Entintado',7,.2],['Contorno pro',5,.3]].forEach(([n,s,mn])=>add(0,n,{s,mn,st:.3}));
[1,2,3,4,6,8,10,12].forEach(s=>add(0,'Constante '+s+'px',{s,pr:0}));
add(0,'Línea limpia 3',{s:3,pr:0,st:.8});add(0,'Línea limpia 6',{s:6,pr:0,st:.8});
[['Sombra suave S',14],['Sombra suave M',24],['Sombra suave L',40],['Aerógrafo',60],['Degradado largo',90]].forEach(([n,s])=>add(1,n,{k:'soft',s,fl:.22,mn:.4,pa:1}));
[['Puntillismo fino',10,6],['Puntillismo M',16,10],['Whip shading 1',22,16],['Whip shading 2',30,26],['Stipple denso',20,42],['Stipple disperso',34,14]].forEach(([n,s,c])=>add(1,n,{k:'stip',s,n:c,d:.9,sp:.35,mn:.5,pa:1}));
[['Grano fino',20,.1],['Grano medio',30,.14],['Grano grueso',40,.2],['Carbón',28,.3],['Tiza',34,.18],['Grafito',18,.25]].forEach(([n,s,c])=>add(1,n,{k:'grain',s,n:c,fl:.8,sp:.2,mn:.5,pa:1}));
[['Magnum 9',16,9],['Magnum 13',22,13],['Magnum 15',26,15]].forEach(([n,s,c])=>add(1,n,{k:'multi',s,n:c,g:s/c,lw:s/c*1.6,fl:.7,sp:.08,pr:0}));
add(1,'Arrastre suave',{k:'soft',s:30,fl:.12,sp:.06,pa:1,mn:.5});add(1,'Arrastre largo',{k:'soft',s:50,fl:.07,sp:.05,pa:1,mn:.5});
[['Doble línea 2',3,6],['Doble línea 3',3,10],['Doble línea 4',3.5,16],['Doble línea 5',4,24]].forEach(([n,lw,g])=>add(2,n,{k:'multi',s:g*2,n:2,g,lw,pr:0,sp:.05}));
[['Triple línea 1',2.5,6],['Triple línea 2',2.5,10],['Triple línea 3',3,14],['Triple línea 4',3,20]].forEach(([n,lw,g])=>add(2,n,{k:'multi',s:g*3,n:3,g,lw,pr:0,sp:.05}));
[['Caligráfico 45° fino',8,-.8],['Caligráfico 45° medio',14,-.8],['Caligráfico 45° grueso',22,-.8],['Plano horizontal',16,0],['Plano vertical',16,1.57]].forEach(([n,s,a])=>add(2,n,{k:'cal',s,a,pr:0,sp:.05}));
[['Lápiz azul','#3b82f6',3],['Lápiz rojo','#ef4444',3],['Boceto azul suave','#60a5fa',8],['Boceto rojo suave','#f87171',8],['Lápiz grafito','#52525b',4]].forEach(([n,c,s])=>add(2,n,{k:'grain',s,n:.45,fl:.85,sp:.15,mn:.5,c,pa:1}));
function dab(c,b,x,y,p,ang,size,col,a,tl){
 let z=b.pr?size*(b.mn+(1-b.mn)*p):size;if(tl&&(b.k=='soft'||b.k=='grain'||b.k=='stip'||b.k=='cal'))z*=1+tl*.9;
 const r=z/2,k=z/b.s;c.globalAlpha=Math.min(1,a*b.fl*(b.pa?.25+.75*p:1));c.fillStyle=col;
 if(b.k=='soft'){const g=c.createRadialGradient(x,y,0,x,y,r);g.addColorStop(0,col);g.addColorStop(1,col+'00');c.fillStyle=g;c.fillRect(x-r,y-r,z,z)}
 else if(b.k=='stip'){for(let i=0,n=Math.ceil(b.n*k*k);i<n;i++){const t=Math.random()*6.283,d=r*Math.sqrt(Math.random());c.beginPath();c.arc(x+Math.cos(t)*d,y+Math.sin(t)*d,b.d,0,6.283);c.fill()}}
 else if(b.k=='grain'){for(let i=0,n=Math.ceil(z*z*b.n);i<n;i++){const t=Math.random()*6.283,d=r*Math.sqrt(Math.random());c.fillRect(x+Math.cos(t)*d,y+Math.sin(t)*d,1.1,1.1)}}
 else if(b.k=='multi'){const px=-Math.sin(ang),py=Math.cos(ang);for(let i=0;i<b.n;i++){const o=(i-(b.n-1)/2)*b.g*k;c.beginPath();c.arc(x+px*o,y+py*o,Math.max(.5,b.lw*k/2),0,6.283);c.fill()}}
 else if(b.k=='cal'){c.beginPath();c.ellipse(x,y,r,Math.max(.6,r*.25),b.a,0,6.283);c.fill()}
 else{c.beginPath();c.arc(x,y,Math.max(.5,r),0,6.283);c.fill()}
}
function seg(c,b,s,x,y,p,size,col,a,tl){
 const dx=x-s.lx,dy=y-s.ly,d=Math.hypot(dx,dy);
 if(s.first){s.first=0;dab(c,b,x,y,p,s.ang||0,size,col,a,tl)}
 if(d<.01)return;const stp=Math.max(.6,size*b.sp),ang=Math.atan2(dy,dx);s.ang=ang;let t=stp-s.rem;
 while(t<=d){const f=t/d;dab(c,b,s.lx+dx*f,s.ly+dy*f,s.lp+(p-s.lp)*f,ang,size,col,a,tl);t+=stp}
 s.rem=d-(t-stp);s.lx=x;s.ly=y;s.lp=p;
}
const ER={k:'round',s:10,mn:.35,fl:1,sp:.1,pr:1};
// ===== capas / doc =====
function addLayer(n){const c=document.createElement('canvas');c.width=W;c.height=H;doc.appendChild(c);const L={c,x:c.getContext('2d'),vis:true,op:1,bl:'normal',n};layers.push(L);act=layers.length-1;sync();return L}
function sync(){layers.forEach((L,i)=>{L.c.style.zIndex=i*2;L.c.style.opacity=L.vis?L.op:0;L.c.style.mixBlendMode=L.bl});tmp.style.zIndex=act*2+1;tmp.style.opacity=op}
function sizeDoc(){doc.style.width=W+'px';doc.style.height=H+'px';tmp.width=W;tmp.height=H}
function resizeDoc(w,h,ox,oy){layers.forEach(L=>{const n=document.createElement('canvas');n.width=w;n.height=h;n.getContext('2d').drawImage(L.c,-ox,-oy);L.c.width=w;L.c.height=h;L.x.drawImage(n,0,0)});W=w;H=h;sizeDoc();U=[];R=[];fit()}
let U=[],R=[];
const snap=(L=layers[act])=>{U.push({L,d:L.x.getImageData(0,0,W,H)});if(U.length>15)U.shift();R=[]};
function undo(){const s=U.pop();if(!s)return;R.push({L:s.L,d:s.L.x.getImageData(0,0,W,H)});s.L.x.putImageData(s.d,0,0)}
function redo(){const s=R.pop();if(!s)return;U.push({L:s.L,d:s.L.x.getImageData(0,0,W,H)});s.L.x.putImageData(s.d,0,0)}
function flat(white){const c=document.createElement('canvas');c.width=W;c.height=H;const x=c.getContext('2d');if(white){x.fillStyle='#fff';x.fillRect(0,0,W,H)}layers.forEach(L=>{if(!L.vis)return;x.globalAlpha=L.op;x.globalCompositeOperation=L.bl=='normal'?'source-over':L.bl;x.drawImage(L.c,0,0)});return c}
function dl(c,n,white){const o=document.createElement('canvas');o.width=c.width;o.height=c.height;const x=o.getContext('2d');if(white){x.fillStyle='#fff';x.fillRect(0,0,o.width,o.height)}x.drawImage(c,0,0);o.toBlob(b=>{const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download=n;document.body.appendChild(a);a.click();setTimeout(()=>{a.remove();URL.revokeObjectURL(a.href)},4000)})}

 p.innerHTML=`<textarea data-k="t" rows="2">${TO.t}</textarea><label>Fuente<select data-k="f" id="tf">${fo(FONTS)}</select></label><button id="tlf" style="width:100%">Cargar fuentes instaladas del equipo</button><label>Forma<select data-k="m">${[['line','Recto'],['arc','Curva / arco'],['circle','Círculo 360°'],['wave','Ondulado']].map(([k,n])=>`<option value="${k}" ${k==TO.m?'selected':''}>${n}</option>`).join('')}</select></label><label>Tamaño<input data-k="sz" type="range" min="20" max="400" value="${TO.sz}"></label><label>Radio<input data-k="R" type="range" min="40" max="900" value="${TO.R}"></label><label>Arco (°)<input data-k="arc" type="range" min="30" max="340" value="${TO.arc}"></label><label>Espaciado<input data-k="sp" type="range" min="-10" max="60" value="${TO.sp}"></label><label>Ondulación<input data-k="amp" type="range" min="0" max="100" value="${TO.amp}"></label><p style="color:var(--mu);margin:8px 0 0">Toca el lienzo para colocar el texto en una capa nueva.</p>`;
 p.oninput=e=>{const k=e.target.dataset.k;if(k)TO[k]=e.target.type=='range'?+e.target.value:e.target.value};

async function placeText(pt){const o=TO;try{await document.fonts.load(`${o.sz}px "${o.f}"`)}catch(e){}const L=addLayer('Texto'),c=L.x,ch=[...o.t.replace(/\n/g,' ')],n=ch.length;c.fillStyle=color;c.font=`${o.sz}px "${o.f}"`;c.textAlign='center';c.textBaseline='middle';
 if(o.m=='arc'||o.m=='circle'){const A=o.m=='circle'?6.2832:o.arc*Math.PI/180;ch.forEach((t,i)=>{c.save();c.translate(pt.x,pt.y);c.rotate(o.m=='circle'?i/n*A:(i+.5)/n*A-A/2);c.translate(0,-o.R);c.fillText(t,0,0);c.restore()})}
 else{const w=ch.map(t=>c.measureText(t).width+o.sp),tot=w.reduce((a,b)=>a+b,0);let x=pt.x-tot/2;ch.forEach((t,i)=>{c.fillText(t,x+w[i]/2,pt.y+(o.m=='wave'?Math.sin(i*.7)*o.amp:0));x+=w[i]})}}

 p.onchange=e=>{if(e.target.id=='sp'&&PRE[e.target.value]){$('#su').value='mm';$('#sw').value=PRE[e.target.value][0];$('#sh').value=PRE[e.target.value][1]}};

function setMod(m){mod=m;$$('#mods button').forEach(b=>b.classList.toggle('on',b.dataset.m==m));['transfer','quit','pint'].forEach(k=>$('#m-'+k).hidden=k!=m);$('#side').hidden=!isD();$('#mpanel').hidden=m!='mandala';if(!isD()){$('#pop').hidden=1;cur=0}ruler()}

const loadF=f=>new Promise((ok,no)=>{const rd=new FileReader();rd.onerror=()=>no(rd.error);rd.onload=()=>{const i=new Image();i.onload=()=>ok(i);i.onerror=()=>no(new Error('formato no soportado'));i.src=rd.result};rd.readAsDataURL(f)});
const pick=(el,fn)=>el.onchange=async e=>{const f=e.target.files[0];e.target.value='';if(!f)return;try{fn(await loadF(f))}catch(err){alert('No se pudo cargar la imagen: '+(err&&err.message||err)+'. Prueba con JPG, PNG o WEBP.')}};
// Transfer
let tG=null;const ts=$('#tsrc'),to=$('#tout');
function blur(a,w,h){const o=new Float32Array(a.length);for(let y=0;y<h;y++)for(let x=0;x<w;x++){let s=0,n=0;for(let j=-1;j<2;j++)for(let i=-1;i<2;i++){const X=x+i,Y=y+j;if(X>=0&&Y>=0&&X<w&&Y<h){s+=a[Y*w+X];n++}}o[y*w+x]=s/n}return o}
function tLoad(img){const k=Math.min(1,1000/Math.max(img.width,img.height)),w=Math.round(img.width*k),h=Math.round(img.height*k);ts.width=w;ts.height=h;const c=ts.getContext('2d');c.fillStyle='#fff';c.fillRect(0,0,w,h);c.drawImage(img,0,0,w,h);const d=c.getImageData(0,0,w,h).data,a=new Float32Array(w*h);for(let i=0;i<w*h;i++)a[i]=.299*d[4*i]+.587*d[4*i+1]+.114*d[4*i+2];tG={g:blur(a,w,h),w,h};tRun()}
function tRun(){if(!tG)return;const{g,w,h}=tG,T=170-$('#t1').value*1.6,S=60+$('#t2').value*1.6,G=+$('#t3').value,m=new Uint8Array(w*h);
 for(let y=0;y<h;y++)for(let x=0;x<w;x++){const i=y*w+x;if(x>0&&y>0&&x<w-1&&y<h-1){const gx=g[i-w+1]+2*g[i+1]+g[i+w+1]-g[i-w-1]-2*g[i-1]-g[i+w-1],gy=g[i+w-1]+2*g[i+w]+g[i+w+1]-g[i-w-1]-2*g[i-w]-g[i-w+1];if(Math.hypot(gx,gy)/4>T)m[i]=1}
  const l=g[i];if(l<S*.35){if(((x-y)%4+4)%4==0)m[i]=1}else if(l<S){if(((x-y)%7+7)%7==0&&Math.floor(y/6)%2==0)m[i]=1}}
 let o=m;for(let k=0;k<G;k++){const n=new Uint8Array(w*h);for(let y=1;y<h-1;y++)for(let x=1;x<w-1;x++){const i=y*w+x;if(o[i]||o[i-1]||o[i+1]||o[i-w]||o[i+w]||o[i-w-1]||o[i-w+1]||o[i+w-1]||o[i+w+1])n[i]=1}o=n}
 to.width=w;to.height=h;const c=to.getContext('2d'),im=c.createImageData(w,h);for(let i=0;i<w*h;i++)if(o[i])im.data[4*i+3]=255;c.putImageData(im,0,0)}
function tFinal(){const c=document.createElement('canvas');c.width=to.width;c.height=to.height;const x=c.getContext('2d');if($('#tmir').checked){x.translate(c.width,0);x.scale(-1,1)}x.drawImage(to,0,0);return c}
pick($('#tfile'),tLoad);
$('#tcan').onclick=()=>tLoad(flat(true));
['t1','t2','t3'].forEach(i=>$('#'+i).oninput=tRun);
$('#tmir').onchange=()=>to.style.transform=$('#tmir').checked?'scaleX(-1)':'';

// Quitafondos
let qO=null,qBg=[255,255,255],qPk=false;const qs=$('#qsrc');
function qLoad(img){const k=Math.min(1,1600/Math.max(img.width,img.height)),w=Math.round(img.width*k),h=Math.round(img.height*k);qs.width=w;qs.height=h;const c=qs.getContext('2d');c.drawImage(img,0,0,w,h);qO=c.getImageData(0,0,w,h);qAuto()}
function qAuto(){if(!qO)return;const{width:w,height:h,data:d}=qO,px=[[0,0],[w-1,0],[0,h-1],[w-1,h-1]].map(([x,y])=>[d[4*(y*w+x)],d[4*(y*w+x)+1],d[4*(y*w+x)+2]]);qBg=[0,1,2].map(k=>px.map(p=>p[k]).sort((a,b)=>a-b)[1]);qRun()}
function qRun(){if(!qO)return;const{width:w,height:h,data:s}=qO,out=new ImageData(new Uint8ClampedArray(s),w,h),d=out.data,tol=$('#q1').value*1.2,sf=$('#q2').value*1.2+.01;
 for(let i=0;i<d.length;i+=4){const dist=Math.hypot(d[i]-qBg[0],d[i+1]-qBg[1],d[i+2]-qBg[2])/1.732;d[i+3]=s[i+3]*(dist<=tol?0:dist>=tol+sf?1:(dist-tol)/sf)}
 qs.getContext('2d').putImageData(out,0,0);$('#qinfo').textContent='Fondo: rgb('+qBg.map(Math.round)+')'}
pick($('#qfile'),qLoad);
$('#qauto').onclick=qAuto;$('#qpick').onclick=function(){qPk=!qPk;this.classList.toggle('on',qPk)};
qs.onclick=e=>{if(!qPk||!qO)return;const x=Math.floor(e.offsetX/qs.clientWidth*qs.width),y=Math.floor(e.offsetY/qs.clientHeight*qs.height),i=4*(y*qO.width+x);qBg=[qO.data[i],qO.data[i+1],qO.data[i+2]];qRun()};
['q1','q2'].forEach(i=>$('#'+i).oninput=qRun);
$('#qdl').onclick=()=>{if(qO)dl(qs,'sin-fondo.png',false)};$('#qins').onclick=()=>{if(qO)putImg(qs)};

$('#p1').onclick=()=>pend&&putImg(pend);$('#p2').onclick=()=>{if(pend){setMod('transfer');tLoad(pend)}};$('#p3').onclick=()=>{if(pend){setMod('quit');qLoad(pend)}};
